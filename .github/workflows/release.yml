name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so we can compare package.json to HEAD^ and existing tags.
          fetch-depth: 0

      - name: Detect package.json version change
        id: version
        run: |
          set -euo pipefail

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD_VERSION=$(git show HEAD^:package.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>console.log(JSON.parse(s).version))")
          else
            OLD_VERSION=""
          fi
          echo "previous=${OLD_VERSION}" >> "$GITHUB_OUTPUT"

          if [ -n "${OLD_VERSION}" ] && git rev-parse -q --verify "refs/tags/v${OLD_VERSION}" >/dev/null; then
            echo "previous_tag=v${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse -q --verify "refs/tags/v${NEW_VERSION}" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"

          if [ "${NEW_VERSION}" = "${OLD_VERSION}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package.json version unchanged (${NEW_VERSION}); skipping release artifact"
          elif [ "${TAG_EXISTS}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${NEW_VERSION} already exists; skipping release artifact"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed ${OLD_VERSION:-<none>} → ${NEW_VERSION}; publishing release"
          fi

      - uses: actions/setup-node@v7
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
        if: steps.version.outputs.changed == 'true'

      - run: npm run build
        if: steps.version.outputs.changed == 'true'

      - name: Generate release notes
        if: steps.version.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.mjs \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.previous_tag }}" \
            release-notes.md
          echo "----- release-notes.md -----"
          cat release-notes.md

      - name: Create tag
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - uses: softprops/action-gh-release@v3
        if: steps.version.outputs.changed == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          # Basename is tapo-c260-card.js — matches hacs.json "filename".
          files: dist/tapo-c260-card.js
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
